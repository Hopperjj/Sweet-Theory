<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sweet Theory | The Recipe For Your Sweet Tooth</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.6;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      border-bottom: 2px solid #111;
      padding: 15px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      min-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      background: #f7f7f7;
    }

    .hero-content {
      max-width: 850px;
    }

    .hero h1 {
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 15px;
    }

    .motto {
      font-size: 1.4rem;
      font-style: italic;
      margin-bottom: 15px;
    }

    .hero p:not(.motto) {
      font-size: 1.15rem;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #111;
      color: white;
      padding: 14px 30px;
      text-decoration: none;
      border: 2px solid #111;
      font-weight: bold;
    }

    .button:hover {
      background: white;
      color: #111;
    }

    section {
      padding: 80px 7%;
    }

    .section-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .section-subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 45px;
    }

    /* MENU */

    .menu-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }

    .menu-card {
      border: 2px solid #111;
      padding: 30px;
      text-align: center;
      background: white;
      transition: 0.2s;
    }

    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 6px 6px 0 #111;
    }

    .menu-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .menu-card h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .menu-card p {
      color: #555;
      margin-bottom: 15px;
    }

    .price {
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* BOXES */

    .packages {
      background: #111;
      color: white;
    }

    .packages .section-subtitle {
      color: #ccc;
    }

    .package-grid {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
    }

    .package {
      background: white;
      color: #111;
      padding: 30px 20px;
      text-align: center;
      border: 2px solid white;
    }

    .package h3 {
      font-size: 2.5rem;
    }

    .package-price {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 8px 0;
    }

    /* ABOUT */

    .about {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .about p {
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    /* ORDER */

    .order-section {
      background: #f5f5f5;
    }

    .order-container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 35px;
      border: 2px solid #111;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 2px solid #111;
      font-size: 1rem;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      padding: 15px;
      background: #111;
      color: white;
      border: 2px solid #111;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:hover {
      background: white;
      color: #111;
    }

    /* CONTACT */

    .contact {
      text-align: center;
    }

    .contact-info {
      margin-top: 25px;
      font-size: 1.1rem;
    }

    /* FOOTER */

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    footer p {
      margin: 5px;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      nav {
        flex-direction: column;
        gap: 10px;
      }

      nav ul {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      section {
        padding: 60px 5%;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .order-container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>
    <div class="logo">SWEET THEORY</div>

    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#menu">Menu</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#order">Order</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
